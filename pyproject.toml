[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "db-collector-os"
version = "0.1.0"
description = "DB Collector OS - a common core for continuous, unattended, multi-database information discovery and collection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "python-dotenv>=1.0",
    "psutil>=5.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    # Required by FastAPI's Form(...) parsing, used by the Competitive
    # Keyword / Content Discovery Engine's "new investigation" form.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "httpx>=0.27",
]
# Competitive Keyword / Content Discovery Engine's Japanese morphological
# analysis (see competitive_intelligence/keyword/tokenizer.py). Optional so
# the existing entity-collection install path never pulls in Sudachi's
# dictionary; a regex-based fallback tokenizer is used when this extra
# isn't installed.
ci = [
    "sudachipy>=0.6",
    "sudachidict_core>=20240109",
]

[project.scripts]
db-collector = "db_collector_os.cli:main"

[tool.setuptools.packages.find]
include = ["db_collector_os*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
