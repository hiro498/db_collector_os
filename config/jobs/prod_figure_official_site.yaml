# PRODUCTION job #1: 美少女フィギュア公式メーカーDB
# Source: Good Smile Company official product pages.
#
# History:
#   - Single-product production proof (1 known URL, max_pages=1): PASSED --
#     entity_count=1, evidence_count=13, run_errors=0, open_reviews=0.
#     Two bugs found from that run were fixed separately (HTML entity
#     decoding in JSON-LD; run_history not being finished by `jobs run`).
#   - This revision expands to Phase 1 batch #1: discovery via internal
#     links from the one verified real product page (see
#     docs/first_production_db.md "Phase 1 discovery method" for why --
#     no listing/category/sitemap URL was guessed).
#
# robots.txt (confirmed): "User-agent: *\nDisallow: /*/search". This job
# never uses search-based discovery and internal_links only ever follows
# links found on already-fetched www.goodsmile.com pages, so it never visits
# a disallowed path.
job_id: "job_prod_figure_official_site"
job_name: "Figure Official Site (Production #1 - Good Smile)"
category: "figure"
target_db: "figure_official_site"
target_table: "entities"
collector_type: "official_site"
adapter: "figure_official_site"
priority: 50
# Keep disabled in Git. The VPS activation script enables the registry row
# directly (db-collector jobs enable/resume) only after preflight checks
# pass -- this file stays enabled: false regardless.
enabled: false
schedule: "@daily"
# Phase 1 batch #1: conservative, bounded expansion from the one verified
# product page. 30/1/5.0 match the task's suggested starting point; kept
# rather than tuned tighter/looser since this environment has no outbound
# web access to verify the real catalog's size or server behavior (see
# docs/first_production_db.md) -- these are safe defaults, not a guess.
max_pages: 30
max_depth: 2
concurrency: 1
rate_limit: 5.0
config:
  seed_urls:
    - "https://www.goodsmile.com/en/product/1141716/Rikka%2BTakarada%2BAkane%2BShinjo%2Bfeat.%2Btoridamono"
  discovery:
    sitemap_urls: []
    robots_seed_urls:
      - "https://www.goodsmile.com/"
    internal_links: true
    related_entities: true
    allowed_domains:
      - "www.goodsmile.com"
  phase1_conditions:
    queue_empty: true
    require_discovery_saturation: true
    consecutive_low_discovery_runs: 3
    max_error_rate: 0.5
    min_entity_count: 1
  incremental_revalidate_after_seconds: 604800
