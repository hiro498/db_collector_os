# PRODUCTION job #1: 美少女フィギュア公式メーカーDB
# First real source: Good Smile Company official product page.
#
# Initial production proof is intentionally limited to ONE verified official
# product page. After entity/evidence/checkpoint/review validation succeeds,
# expand discovery in a separate follow-up change.
job_id: "job_prod_figure_official_site"
job_name: "Figure Official Site (Production #1 - Good Smile)"
category: "figure"
target_db: "figure_official_site"
target_table: "entities"
collector_type: "official_site"
adapter: "figure_official_site"
priority: 50
# Keep disabled in Git. VPS activation enables the registry only after the
# Resource Controller admits a new job.
enabled: false
schedule: "@daily"
# First production proof: exactly one known official Product JSON-LD page.
max_pages: 1
max_depth: 0
concurrency: 1
rate_limit: 5.0
config:
  seed_urls:
    - "https://www.goodsmile.com/en/product/1141716/Rikka%2BTakarada%2BAkane%2BShinjo%2Bfeat.%2Btoridamono"
  discovery:
    sitemap_urls: []
    robots_seed_urls:
      - "https://www.goodsmile.com/"
    internal_links: false
    related_entities: false
    allowed_domains:
      - "www.goodsmile.com"
  phase1_conditions:
    queue_empty: true
    require_discovery_saturation: false
    consecutive_low_discovery_runs: 1
    max_error_rate: 0.5
    min_entity_count: 1
  incremental_revalidate_after_seconds: 604800
