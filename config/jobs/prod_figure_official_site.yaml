# PRODUCTION job #1: 美少女フィギュア公式メーカーDB
# Source: Good Smile Company official site (www.goodsmile.com).
#
# History:
#   - Single-product production proof (1 known URL, max_pages=1): PASSED --
#     entity_count=1, evidence_count=13, run_errors=0, open_reviews=0. Two
#     bugs found from that run were fixed separately (HTML entity decoding
#     in JSON-LD; run_history not being finished by `jobs run`).
#   - First Phase 1 batch #1 revision seeded from that single product page
#     via internal_links (no listing page was known/verified yet).
#   - This revision: the user confirmed a real, existing entry point --
#     https://www.goodsmile.com/en/scalefigure_list (the official "Scale
#     Figure Reference List") -- and that it mixes multiple manufacturers/
#     brands (Good Smile Company, Max Factory, ...). That page is now the
#     primary seed. See docs/first_production_db.md "Phase 1 discovery
#     method" for the full reasoning, including why pagination discovery
#     was deliberately NOT implemented (this environment has no outbound
#     web access to verify the real pagination mechanism -- only the
#     listing page's own embedded links, whatever they are, get followed;
#     nothing was guessed).
#
# robots.txt (confirmed): "User-agent: *\nDisallow: /*/search". This job
# never uses search-based discovery, and `discovery.product_url_pattern`
# below scopes internal_links to product-detail and scalefigure_list URLs
# only -- it structurally cannot enqueue a /search path.
job_id: "job_prod_figure_official_site"
job_name: "Figure Official Site (Production #1 - Good Smile)"
category: "figure"
target_db: "figure_official_site"
target_table: "entities"
collector_type: "official_site"
adapter: "figure_official_site"
priority: 50
# Keep disabled in Git. The VPS batch script enables the registry row
# directly (db-collector jobs enable/resume) only after preflight checks
# pass -- this file stays enabled: false regardless.
enabled: false
schedule: "@daily"
# Phase 1 batch #1: conservative, bounded expansion from the one verified
# listing page. 30/1/5.0 match the task's suggested starting point; kept
# rather than tuned tighter/looser since this environment has no outbound
# web access to verify the real catalog's size or server behavior (see
# docs/first_production_db.md) -- these are safe defaults, not a guess.
max_pages: 30
max_depth: 2
concurrency: 1
rate_limit: 5.0
config:
  seed_urls:
    - "https://www.goodsmile.com/en/scalefigure_list"
    # Kept as a second seed: the one page-level proof this job has actually
    # completed successfully end to end.
    - "https://www.goodsmile.com/en/product/1141716/Rikka%2BTakarada%2BAkane%2BShinjo%2Bfeat.%2Btoridamono"
  discovery:
    sitemap_urls: []
    robots_seed_urls:
      - "https://www.goodsmile.com/"
    internal_links: true
    related_entities: true
    allowed_domains:
      - "www.goodsmile.com"
    # Scopes internal_links to (a) product detail URLs -- capture group 1 is
    # the numeric product ID, used to dedup two different URLs (different
    # slug) for the same product before either is even fetched -- and
    # (b) the scalefigure_list page itself, so if it paginates via a
    # same-path link (e.g. a "next page" href), that link is still
    # followed. Pattern derived from the one confirmed real product URL
    # above (/en/product/<id>/<slug>) and the confirmed real listing URL --
    # not a guess. See discovery/internal_links.py.
    product_url_pattern: "/en/product/(\\d+)/|/en/scalefigure_list"
  # Batch #2 production result: with only this single domain in play and
  # rate_limit=5.0, _drain_fetch_queue() fetched exactly ONE page per
  # run_once() call (the domain becomes not-ready the instant the first
  # request is recorded, so every subsequent claim attempt in the same call
  # found nothing ready and gave up) -- 73 separate runs instead of one
  # ~3-run batch for 73 pages at max_pages=30. Opting in here lets one
  # run_once() call wait out the (short) per-request gap and keep draining
  # toward max_pages instead of deferring to a brand-new run every time.
  # 180s covers max_pages=30 fetched fully serially at rate_limit=5.0
  # (~150s) plus slack; still bounded, still concurrency=1, still exactly
  # rate_limit=5.0 between requests -- this does not loosen any rate
  # limiting, it only lets one logical run wait through it instead of
  # bailing out after a single page. See collectors/pipeline.py
  # BaseCollector._drain_fetch_queue().
  max_drain_wait_seconds: 180
  phase1_conditions:
    queue_empty: true
    require_discovery_saturation: true
    consecutive_low_discovery_runs: 3
    max_error_rate: 0.5
    min_entity_count: 1
  incremental_revalidate_after_seconds: 604800
